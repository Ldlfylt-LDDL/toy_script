// 7-day moving average
function ma7(arr) {
  return arr.map((_, i) => {
    const slice = arr.slice(Math.max(0, i - 6), i + 1);
    return Math.round(slice.reduce((s, v) => s + v, 0) / slice.length);
  });
}

const volChart = new Chart(document.getElementById('chart1').getContext('2d'), {
  type: 'line',
  data: {
    labels: DATES,
    datasets: RESEARCH.map((r, i) => ({
      label: r.zh,
      data: ma7(VOL[r.id]),
      borderColor: COLORS[i],
      backgroundColor: COLORS[i] + '18',
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 4,
      tension: 0.4,
      hidden: r.id === 100,
    })),
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'top',
        labels: { color: '#cdd6f4', padding: 10, font: { size: 11 }, boxWidth: 18 },
        onHover(e, item, legend) {
          legend.chart.data.datasets.forEach((ds, i) => {
            ds.borderWidth = i === item.datasetIndex ? 3 : 1;
            ds.borderColor = i === item.datasetIndex ? COLORS[i] : COLORS[i] + '55';
          });
          legend.chart.update('none');
        },
        onLeave(e, item, legend) {
          legend.chart.data.datasets.forEach((ds, i) => {
            ds.borderWidth = 2;
            ds.borderColor = COLORS[i];
          });
          legend.chart.update('none');
        },
      },
      tooltip: {
        backgroundColor: '#1e2030', titleColor: '#89dceb', bodyColor: '#cdd6f4',
        borderColor: '#313244', borderWidth: 1,
        callbacks: {
          label: c => ` ${c.dataset.label}：${(c.parsed.y/1000).toFixed(0)}K`,
        },
      },
      zoom: {
        pan: { enabled: true, mode: 'x' },
        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
        limits: { x: { minRange: 7 } },
      },
    },
    scales: {
      x: { ticks: { color: '#6c7086', font: { size: 10 }, maxTicksLimit: 15 }, grid: { color: '#1a1f35' } },
      y: {
        title: { display: true, text: '7日均量', color: '#89dceb', font: { size: 12 } },
        ticks: { color: '#6c7086', font: { size: 11 }, callback: v => v >= 1e6 ? (v/1e6).toFixed(1)+'M' : (v/1000).toFixed(0)+'K' },
        grid: { color: '#1a1f35' },
      },
    },
  },
});

// ── Tab switch ────────────────────────────────────────────────────────────
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}
